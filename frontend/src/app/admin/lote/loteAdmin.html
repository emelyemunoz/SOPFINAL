<div class="admin-page">
   <nav class="admin-nav">

  <a
    routerLink="/admin/producto"
    routerLinkActive="active">
    Producto
   </a>

  <a
    routerLink="/admin/lote"
    routerLinkActive="active">
    Lote
  </a>

  <a
    routerLink="/admin/pedido"
    routerLinkActive="active">
    Pedido
  </a>

<a
      routerLink="/admin/auditoria"
      routerLinkActive="active">
      Auditoría
    </a>


    <button
      type="button"
      class="cerrar-sesion"
      (click)="cerrarSesion()">
      Cerrar sesión
    </button>

</nav>

  <h1>Gestión de lotes</h1>

  <form (ngSubmit)="guardar()">
    <div class="field">
      <label for="estilo">Estilo</label>
      <input id="estilo" type="text" [(ngModel)]="loteForms.estilo" name="estilo" required>
    </div>

    <div class="field">
      <label for="stock">Stock</label>
      <input id="stock" type="number" [(ngModel)]="loteForms.stock" name="stock" required>
    </div>

    <div class="field">
      <label for="talla">Talla</label>
      <input id="talla" type="number" [(ngModel)]="loteForms.talla" name="talla" required>
    </div>

    <button type="submit">{{ editando ? 'Actualizar' : 'Crear' }}</button>
    <button type="button" *ngIf="editando" (click)="cancelar()">Cancelar</button>
  </form>

  <table>
    <thead>
      <tr>
        <th>Estilo</th>
        <th>Stock</th>
        <th>Talla</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let lote of lotes">
        <td>{{ lote.estilo }}</td>
        <td>{{ lote.stock }}</td>
        <td>{{ lote.talla }}</td>
        <td>
          <button (click)="editar(lote)">Editar</button>
          <button (click)="eliminar(lote.idlote)">Eliminar</button>
        </td>
      </tr>
    </tbody>
  </table>

</div>
